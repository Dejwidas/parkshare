<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resetowanie hasła — ParkShare</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0f1117;color:#e8eaf0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .logo{display:flex;flex-direction:column;align-items:center;margin-bottom:32px;}
    .logo-icon{width:56px;height:56px;border-radius:12px;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;margin-bottom:10px;}
    .logo-name{font-size:22px;font-weight:700;color:#a78bfa;}
    .card{background:#1a1d2e;border:1px solid #2a2d3e;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;}
    .card h1{font-size:18px;font-weight:700;color:#e8eaf0;margin-bottom:6px;}
    .card p{font-size:13px;color:#6b7280;margin-bottom:20px;line-height:1.6;}
    label{display:block;font-size:12px;color:#9ca3af;margin-bottom:5px;}
    input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #2a2d3e;background:#0f1117;color:#e8eaf0;font-size:14px;margin-bottom:12px;outline:none;}
    input:focus{border-color:#7c3aed;}
    .btn{width:100%;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;}
    .btn-primary{background:#7c3aed;color:#fff;}
    .btn-primary:disabled{opacity:0.5;cursor:default;}
    .btn-ghost{background:transparent;color:#7c3aed;margin-top:8px;}
    .msg{font-size:12px;margin-bottom:12px;padding:8px 12px;border-radius:8px;}
    .msg-err{background:#3b0d0d;color:#f87171;}
    .msg-ok{background:#064e3b;color:#6ee7b7;}
    .spinner{width:28px;height:28px;border:3px solid #2a2d3e;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

  <div class="logo">
    <div class="logo-icon">P</div>
    <div class="logo-name">ParkShare</div>
  </div>

  <div class="card" id="card-loading">
    <div class="spinner"></div>
    <p style="text-align:center;margin-top:8px;">Weryfikowanie linku...</p>
  </div>

  <div class="card" id="card-form" style="display:none;">
    <h1>Nowe hasło</h1>
    <p>Wpisz nowe hasło dla swojego konta ParkShare.</p>
    <div id="msg-form"></div>
    <label>Nowe hasło (min. 6 znaków)</label>
    <input type="password" id="pass1" placeholder="Nowe hasło"/>
    <label>Powtórz nowe hasło</label>
    <input type="password" id="pass2" placeholder="Powtórz hasło"/>
    <button class="btn btn-primary" id="btn-save" onclick="savePassword()">Ustaw nowe hasło</button>
  </div>

  <div class="card" id="card-success" style="display:none;text-align:center;">
    <div style="font-size:36px;margin-bottom:12px;">✅</div>
    <h1 style="margin-bottom:8px;">Hasło zmienione!</h1>
    <p style="margin-bottom:20px;">Możesz teraz zalogować się nowym hasłem.</p>
    <a href="/" class="btn btn-primary" style="display:block;text-decoration:none;text-align:center;padding:10px;">Przejdź do logowania</a>
  </div>

  <div class="card" id="card-error" style="display:none;text-align:center;">
    <div style="font-size:36px;margin-bottom:12px;">❌</div>
    <h1 style="margin-bottom:8px;">Link wygasł</h1>
    <p style="margin-bottom:20px;">Link do resetu hasła jest nieważny lub wygasł. Wróć do logowania i spróbuj ponownie.</p>
    <a href="/" class="btn btn-primary" style="display:block;text-decoration:none;text-align:center;padding:10px;">Wróć do logowania</a>
  </div>

  <script>
    var SUPABASE_URL = "https://rbpnmvzggshgytzascqz.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJicG5tdnpnZ3NoZ3l0emFzY3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzE2MDAsImV4cCI6MjA5MzA0NzYwMH0.ahtUVzG2CDbagn8PtO4keBrey1NtbIKVcZHDQsq8vjc";
    var accessToken = null;

    function show(id) {
      ["card-loading","card-form","card-success","card-error"].forEach(function(c){
        document.getElementById(c).style.display = c===id ? "block" : "none";
      });
    }

    function showMsg(id, msg, type) {
      var el = document.getElementById(id);
      el.className = "msg msg-"+(type||"err");
      el.textContent = msg;
      el.style.display = msg ? "block" : "none";
    }

    // Supabase wysyła link z ?code= (PKCE flow)
    // Wymieniamy code na sesję po stronie przeglądarki
    async function init() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");

      if (!code) {
        // Sprawdź też hash (stary flow)
        var hash = window.location.hash.substring(1);
        var hashParams = new URLSearchParams(hash);
        var type = hashParams.get("type");
        if (type === "recovery") {
          accessToken = hashParams.get("access_token");
          if (accessToken) { show("card-form"); return; }
        }
        show("card-error");
        return;
      }

      try {
        var r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=pkce", {
          method: "POST",
          headers: { "Content-Type":"application/json", "apikey": SUPABASE_KEY },
          body: JSON.stringify({ auth_code: code })
        });
        var d = await r.json();
        if (d.access_token) {
          accessToken = d.access_token;
          show("card-form");
        } else {
          show("card-error");
        }
      } catch(e) {
        show("card-error");
      }
    }

    async function savePassword() {
      var p1 = document.getElementById("pass1").value;
      var p2 = document.getElementById("pass2").value;
      showMsg("msg-form","");

      if (!p1 || !p2) { showMsg("msg-form","Uzupełnij oba pola."); return; }
      if (p1.length < 6) { showMsg("msg-form","Hasło musi mieć min. 6 znaków."); return; }
      if (p1 !== p2) { showMsg("msg-form","Hasła nie są identyczne."); return; }

      var btn = document.getElementById("btn-save");
      btn.disabled = true; btn.textContent = "Zapisywanie...";

      try {
        var r = await fetch(SUPABASE_URL+"/auth/v1/user", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer "+accessToken
          },
          body: JSON.stringify({ password: p1 })
        });
        var d = await r.json();
        if (r.ok) {
          show("card-success");
        } else {
          showMsg("msg-form", d.message || "Błąd zapisu hasła.");
          btn.disabled = false; btn.textContent = "Ustaw nowe hasło";
        }
      } catch(e) {
        showMsg("msg-form","Błąd połączenia. Spróbuj ponownie.");
        btn.disabled = false; btn.textContent = "Ustaw nowe hasło";
      }
    }

    init();
  </script>
</body>
</html>
